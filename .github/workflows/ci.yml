name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  forbidden-files:
    name: No secrets or binaries added
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check added, copied and renamed files
        run: |
          # -z prints paths raw and NUL-terminated, so no name is quoted or split.
          # git diff runs as its own command so that a git failure fails the step.
          list=$(mktemp)
          git diff -z --name-only --find-renames --find-copies --diff-filter=ACR "origin/${{ github.base_ref }}...HEAD" > "$list"
          bad=$(grep -ziE '\.(jks|keystore|p12|b64|pem|p8|key|aab|apk|log)$|play-account\.json$|(^|/)\.env' "$list" | tr '\0' '\n' || true)
          if [ -n "$bad" ]; then
            echo "These files must not be committed:"
            echo "$bad"
            exit 1
          fi

  build:
    name: Lint, unit tests, debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint, test, build
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7
