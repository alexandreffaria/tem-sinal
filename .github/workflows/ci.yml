name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  forbidden-files:
    name: No secrets or binaries added
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check added files
        run: |
          added=$(git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}...HEAD")
          bad=$(printf '%s\n' "$added" | grep -E '\.(jks|keystore|p12|aab|apk|log)$|play-account\.json$|(^|/)\.env' || true)
          if [ -n "$bad" ]; then
            echo "These files must not be committed:"
            echo "$bad"
            exit 1
          fi

  build:
    name: Lint, unit tests, debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint, test, build
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7
