name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'storage.cors.json'
      - 'firebase.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Deploys run one at a time, in merge order, and none is cancelled.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Functions, Firestore rules and indexes, Storage rules and CORS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: functions/package.json

      # Workload Identity Federation: GitHub's OIDC token for this repo's main branch is exchanged
      # for the deploy service account's credentials. No key is stored anywhere. The provider only
      # accepts tokens for repository id 1457321730 on refs/heads/main.
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: projects/1048309727525/locations/global/workloadIdentityPools/github/providers/tem-sinal
          service_account: github-deploy@cellsignalmapper-a9da1.iam.gserviceaccount.com

      - name: Install functions dependencies
        run: npm ci --prefix functions

      # `firestore` deploys the rules and the indexes, including the TTL field overrides that
      # delete stored samples and upload counters; `storage` deploys storage.rules to the bucket
      # firebase.json names. Naming it keeps firebase-tools from looking up the default bucket,
      # which the Firebase Storage API answers with 404 for this account.
      - name: Deploy
        run: npx --yes firebase-tools@15.34.2 deploy --only functions,firestore,storage --project cellsignalmapper-a9da1 --non-interactive

      # CORS is a setting of the whole bucket, not of a path: a page on any origin may GET or HEAD
      # any object in it, and storage.rules still decides which objects anyone may read (the
      # tiles). gcloud comes with the runner image and uses the credentials the auth step wrote.
      - name: Set the bucket's CORS
        run: gcloud storage buckets update gs://cellsignalmapper-a9da1.firebasestorage.app --cors-file=storage.cors.json
