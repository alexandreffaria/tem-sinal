name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'decisions/**'
      - 'plans/**'
      - 'docs/**'
      - '.claude/**'
      - 'functions/**'
      - '**.md'
      - '.github/workflows/ci.yml'

permissions:
  contents: write

# Releases run one at a time, in merge order, and none is cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Signed APK and AAB to GitHub Releases
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Require the signing secrets
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set; nothing is released unsigned."
              exit 1
            fi
          done

      # The offset puts every release above the versionCodes built before this workflow existed,
      # and run_number grows with each run, so each release installs over the last one.
      - name: Set version
        run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 1000))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The keystore is written only to the runner's temp folder, outside the checkout.
      - name: Decode keystore
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        run: |
          ./gradlew assembleRelease bundleRelease \
            -PversionCode="$VERSION_CODE" \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # An unsigned build is named app-release-unsigned.apk, so a missing signature fails here
      # either way. Only the certificate's SHA-256 digest is printed.
      - name: Verify signatures
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -m 1 'certificate SHA-256 digest'
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep -x 'jar verified.'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          apk="$RUNNER_TEMP/dist/tem-sinal-1.0.$VERSION_CODE.apk"
          aab="$RUNNER_TEMP/dist/tem-sinal-1.0.$VERSION_CODE.aab"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          cp app/build/outputs/bundle/release/app-release.aab "$aab"
          git log -1 --format=%B "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION_CODE" "$apk" "$aab" \
            --target "$GITHUB_SHA" \
            --title "1.0.$VERSION_CODE" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
