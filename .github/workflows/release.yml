name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'decisions/**'
      - 'plans/**'
      - 'docs/**'
      - '.claude/**'
      - 'functions/**'
      - 'map/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'storage.cors.json'
      - 'firebase.json'
      - '**.md'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/pages.yml'

permissions:
  contents: write

# Release runs never overlap. GitHub keeps at most one waiting run per group: a push that
# arrives while one run is in progress and another is waiting cancels the waiting one, so that
# merge gets no release. Merging one pull request at a time gives each merge its own release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Signed APK and AAB to GitHub Releases
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The signing secrets are set only on the steps that use them, so the third-party actions
    # never have them in their environment.
    steps:
      - name: Require the signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set; nothing is released unsigned."
              exit 1
            fi
          done

      # The offset puts every release above the versionCodes built before this workflow existed,
      # and run_number grows with each run, so each release installs over the last one.
      - name: Set version
        run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 1000))" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # The keystore is written only to the runner's temp folder, outside the checkout.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            -PversionCode="$VERSION_CODE" \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # An unsigned build is named app-release-unsigned.apk, so a missing signature fails here
      # either way. Only the certificate's SHA-256 digest is printed.
      - name: Verify signatures
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -m 1 'certificate SHA-256 digest'
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep -x 'jar verified.'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          apk="$RUNNER_TEMP/dist/tem-sinal-1.0.$VERSION_CODE.apk"
          aab="$RUNNER_TEMP/dist/tem-sinal-1.0.$VERSION_CODE.aab"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          cp app/build/outputs/bundle/release/app-release.aab "$aab"
          git log -1 --format=%B "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION_CODE" "$apk" "$aab" \
            --target "$GITHUB_SHA" \
            --title "1.0.$VERSION_CODE" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
